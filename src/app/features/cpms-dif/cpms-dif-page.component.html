<div class="min-h-screen bg-slate-100">
  <section class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
    <div class="overflow-hidden rounded-3xl border border-emerald-200 bg-white shadow-[0_18px_45px_-30px_rgba(6,95,70,0.55)]">
      <div class="bg-[linear-gradient(135deg,#065f46_0%,#0f766e_45%,#d1fae5_100%)] px-5 py-4 text-white sm:px-6">
        <div class="max-w-3xl">
          <div class="mb-2 inline-flex items-center gap-2 rounded-full border border-white/25 bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.22em]">
            <lucide-angular [img]="ShieldCheckIcon" class="h-4 w-4"></lucide-angular>
            IMSS Bienestar - Baja California
          </div>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3">
            <img src="imssb-logo.svg" alt="IMSS Bienestar" class="h-11 w-auto rounded-xl bg-white/90 px-2.5 py-1.5 shadow-sm" />
              <div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                  <span class="rounded-full bg-white/15 px-2.5 py-1 text-xs font-semibold text-emerald-50">
                    Comparativo CPMs CDMX vs Propuestos por unidades
                  </span>
                </div>
                <p class="mt-1 max-w-2xl text-sm text-emerald-50/90">
                  Revisa diferencias por estatus y cambia entre detalle y resumen.
                </p>
              </div>
            </div>
            <button
              type="button"
              class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border border-white/20 bg-white/10 px-4 py-2 text-sm font-semibold text-white transition hover:bg-white/20 disabled:cursor-not-allowed disabled:opacity-60"
              [disabled]="exportando()"
              (click)="exportarTodoExcel()">
              <lucide-angular [img]="DownloadIcon" class="h-4 w-4"></lucide-angular>
              {{ exportando() ? 'Exportando...' : 'Exportar Excel' }}
            </button>
          </div>
        </div>
      </div>

      <div class="border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
        <div class="inline-flex rounded-2xl bg-slate-100 p-1">
          <button
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-semibold transition"
            [ngClass]="tab === 'detalle'
              ? 'bg-white text-emerald-800 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'"
            (click)="tab = 'detalle'">
            Detalle
          </button>
          <button
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-semibold transition"
            [ngClass]="tab === 'resumen'
              ? 'bg-white text-emerald-800 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'"
            (click)="tab = 'resumen'">
            Resumen
          </button>
        </div>
      </div>

      <div class="bg-slate-50 px-4 py-5 sm:px-6">
        @if (tab === 'detalle') {
          <app-detalle></app-detalle>
        } @else if (tab === 'resumen') {
          <app-resumen></app-resumen>
        }
      </div>
    </div>
  </section>
</div>
