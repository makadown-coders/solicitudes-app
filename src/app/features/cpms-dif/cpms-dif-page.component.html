<div class="min-h-screen bg-slate-100">
  <section class="mx-auto px-4 py-4 max-w-7xl sm:px-6 lg:px-8">
    <div class="overflow-hidden bg-white rounded-3xl border-emerald-200 shadow-[0_18px_45px_-30px_rgba(6,95,70,0.55)] border">
      <div class="px-5 py-4 text-white bg-[linear-gradient(135deg,#065f46_0%,#0f766e_45%,#d1fae5_100%)] sm:px-6">
        <div class="max-w-3xl">
          <div class="inline-flex items-center gap-2 mb-2 px-3 py-1 text-[11px] font-semibold tracking-[0.22em] bg-white/10 rounded-full border-white/25 border uppercase">
            <lucide-angular [img]="ShieldCheckIcon" class="h-4 w-4"></lucide-angular>
            IMSS Bienestar - Baja California
          </div>
          <div class="flex flex-col gap-3 sm:flex-row items-center justify-between">
            <div class="flex items-center gap-3">
            <img src="imssb-logo.svg" alt="IMSS Bienestar" class="px-2.5 py-1.5 h-11 w-auto bg-white/90 rounded-xl shadow-sm" />
              <div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                  <span class="px-2.5 py-1 text-xs font-semibold text-emerald-50 bg-white/15 rounded-full">
                    Comparativo CPMs CDMX vs Propuestos por unidades
                  </span>
                </div>
                <p class="mt-1 max-w-2xl text-sm text-emerald-50/90">
                  Revisa diferencias por estatus y cambia entre detalle y resumen.
                </p>
              </div>
            </div>
            <button
              type="button"
              class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-white/10 rounded-xl border-white/20 cursor-pointer border transition hover:bg-white/20 disabled:cursor-not-allowed disabled:opacity-60"
              [disabled]="exportando()"
              (click)="exportarTodoExcel()">
              <lucide-angular [img]="DownloadIcon" class="h-4 w-4"></lucide-angular>
              {{ exportando() ? 'Exportando...' : 'Exportar Excel' }}
            </button>
          </div>
        </div>
      </div>

      <div class="px-4 py-3 bg-white border-b border-slate-200 sm:px-6">
        <div class="inline-flex p-1 bg-slate-100 rounded-2xl">
          <button
            type="button"
            class="px-4 py-2 text-sm font-semibold rounded-xl cursor-pointer transition"
            [ngClass]="tab === 'detalle'
              ? 'bg-white text-emerald-800 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'"
            (click)="tab = 'detalle'">
            Detalle
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-semibold rounded-xl cursor-pointer transition"
            [ngClass]="tab === 'resumen'
              ? 'bg-white text-emerald-800 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'"
            (click)="tab = 'resumen'">
            Resumen
          </button>
          <button
            type="button"
            class="px-4 py-2 text-sm font-semibold rounded-xl cursor-pointer transition"
            [ngClass]="tab === 'indicadores'
              ? 'bg-white text-emerald-800 shadow-sm'
              : 'text-slate-600 hover:text-slate-900'"
            (click)="tab = 'indicadores'">
            Indicadores
          </button>
        </div>
      </div>

      <div class="px-4 py-5 bg-slate-50 sm:px-6">
        @if (tab === 'detalle') {
          <app-detalle></app-detalle>
        } @else if (tab === 'resumen') {
          <app-resumen></app-resumen>
        } @else if (tab === 'indicadores') {
          <app-kpis></app-kpis>
        }
      </div>
    </div>
  </section>
</div>
