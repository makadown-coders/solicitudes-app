<div class="mx-auto px-4 w-full max-w-[1800px]">
    <div class="p-6">
        <!-- Header (reusa tu header actual) -->
        <!-- Header con botón de refrescar -->
        <div class="flex justify-between items-center mb-4 dark:bg-black">
            <h1 class="text-2xl font-bold">Dashboard Abasto</h1>
            <div class="flex items-center ml-auto">
                <button (click)="themeService.toggleTheme()"
                    class="px-3 py-1 ml-4 mr-4 text-white bg-[#006341] cursor-pointer rounded disabled:opacity-50 boton-modo">
                    {{ themeService.isDarkMode() ? 'Modo Claro' : 'Modo Oscuro' }}
                </button>
                <button (click)="onRefresh()"
                    class="px-3 py-1 ml-4 mr-4 text-white bg-[#006341] cursor-pointer rounded disabled:opacity-50 boton-refrescar">
                    🔄 Refrescar datos
                </button>
                <!-- Logo -->
                <img [src]="themeService.isDarkMode() ? 'imssb-logo-blanco.png' : 'imssb-logo.svg'" alt="IMSS Bienestar"
                    class="ml-auto h-10 md:h-12" />
            </div>
        </div>

        <div class="flex gap-4 min-w-0">
            <!-- Sidebar -->
            <app-sidebar-accordion class="shrink-0" />

            <!-- Content -->
            <main class="overflow-hidden flex-1 p-4 min-w-0 bg-white border-custom-default rounded-2xl dark:bg-[#1a202c]">
                <router-outlet />
            </main>
        </div>
    </div>
</div>
