<div class="mx-auto w-full max-w-[1800px] px-2 sm:px-4">
    <div class="py-3 sm:p-6">
        <header class="mb-4 flex flex-wrap items-center gap-2">
            <button type="button" (click)="toggleMenu()" aria-controls="dashboard-menu"
                [attr.aria-expanded]="menuVisible()"
                [attr.aria-label]="menuVisible() ? 'Cerrar menú' : 'Abrir menú'"
                class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg border-custom-default bg-white text-xl">
                {{ menuVisible() ? '×' : '☰' }}
            </button>
            <h1 class="text-xl font-bold sm:text-2xl">Dashboard Abasto</h1>

            <div class="flex flex-1 flex-wrap items-center justify-end gap-2">
                <button type="button" (click)="onRefresh()"
                    class="min-h-11 rounded-lg bg-[#006341] px-3 py-2 text-sm text-white boton-refrescar">
                    ↻ <span class="hidden sm:inline">Refrescar datos</span><span class="sm:hidden">Refrescar</span>
                </button>
                <img src="imssb-logo.svg" alt="IMSS Bienestar" class="hidden h-10 sm:block md:h-12" />
            </div>
        </header>

        <div class="relative flex min-w-0 gap-4">
            @if (menuVisible()) {
                <button type="button" aria-label="Cerrar menú" (click)="closeMenu()"
                    class="fixed inset-0 z-30 bg-black/45 lg:hidden"></button>
            }

            <div id="dashboard-menu"
                class="menu-panel fixed inset-y-0 left-0 z-40 w-[min(20rem,88vw)] overflow-y-auto bg-white p-3 text-slate-800 shadow-2xl transition-transform duration-200 [color-scheme:light] lg:static lg:w-72 lg:bg-transparent lg:p-0 lg:shadow-none"
                [class.menu-closed]="!menuVisible()">
                <app-sidebar-accordion class="block" (navigationSelected)="onNavigationSelected()" />
            </div>

            <main class="min-w-0 flex-1 overflow-visible rounded-2xl border-custom-default bg-white p-3 sm:p-4">
                <router-outlet />
            </main>
        </div>
    </div>
</div>
