<div class="grid gap-3">
  @for (articulo of articulos; track articulo.clave) {
    <article class="py-5 border-b border-slate-100 last:border-b-0">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="min-w-0">
          <h3 class="font-semibold leading-snug text-slate-900" [title]="articulo.descripcion">{{ descripcionVisible(articulo.descripcion) }}</h3>
          <p class="mt-1 text-sm text-slate-600">{{ articulo.presentacion || 'Presentación no especificada' }}</p>
          <p class="mt-2 text-xs font-medium tracking-wide text-slate-400">Clave {{ articulo.clave }}</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 sm:flex-nowrap">
          <div class="flex items-center h-11 bg-slate-50 rounded-xl border border-slate-200" aria-label="Cantidad solicitada">
            <button type="button" class="grid w-10 h-10 place-items-center text-slate-600 rounded-l-xl hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-emerald-600"
              [attr.aria-label]="'Disminuir cantidad de ' + articulo.descripcion" (click)="ajustar(articulo.clave, -1)">
              <lucide-angular [img]="MinusIcon" class="w-4 h-4"></lucide-angular>
            </button>
            <input type="number" min="1" max="99999" inputmode="numeric"
              class="w-16 h-10 text-sm font-semibold text-center bg-transparent outline-none"
              [ngModel]="cantidad(articulo.clave)" (ngModelChange)="cambiarCantidad(articulo.clave, $event)"
              [attr.aria-label]="'Cantidad de ' + articulo.descripcion" />
            <button type="button" class="grid w-10 h-10 place-items-center text-slate-600 rounded-r-xl hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-emerald-600"
              [attr.aria-label]="'Aumentar cantidad de ' + articulo.descripcion" (click)="ajustar(articulo.clave, 1)">
              <lucide-angular [img]="PlusIcon" class="w-4 h-4"></lucide-angular>
            </button>
          </div>
          <button type="button" class="inline-flex items-center justify-center gap-2 px-4 h-11 font-semibold text-white bg-emerald-700 rounded-xl transition hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700"
            (click)="agregarArticulo(articulo)">
            <lucide-angular [img]="claveAgregada === articulo.clave ? CheckIcon : BasketIcon" class="w-4 h-4"></lucide-angular>
            {{ claveAgregada === articulo.clave ? 'Agregado' : 'Agregar' }}
          </button>
        </div>
      </div>
    </article>
  }
</div>
