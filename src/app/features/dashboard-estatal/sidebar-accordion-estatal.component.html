<aside class="w-72 shrink-0 rounded-2xl border border-gray-100 bg-white p-3 shadow-sm">
  <div class="px-2 py-2 text-sm font-semibold text-slate-700">
    Menú estatal
  </div>

  <nav class="space-y-1">
    @for (item of items(); track item.id) {
      @if (item.type === 'group') {
        <button
          type="button"
          class="flex w-full items-center justify-between rounded-xl border border-transparent px-3 py-2 hover:bg-emerald-50"
          [class.border-emerald-100]="expandedGroupId() === item.id"
          [class.bg-emerald-50]="expandedGroupId() === item.id"
          (click)="toggleGroup(item.id)">
          <span class="text-sm font-medium text-slate-700">{{ item.label }}</span>
          <span class="text-xs text-slate-500">{{ expandedGroupId() === item.id ? '▾' : '▸' }}</span>
        </button>

        @if (expandedGroupId() === item.id) {
          <div class="ml-2 mt-1 space-y-1 border-l border-gray-200 pl-2">
            @for (ch of item.children; track ch.id) {
              @if (ch.type === 'link') {
                <a
                  class="block rounded-xl px-3 py-2 text-sm text-slate-600 hover:bg-emerald-50"
                  [routerLink]="ch.route"
                  routerLinkActive="bg-emerald-100 text-emerald-900 font-semibold">
                  {{ ch.label }}
                </a>
              }
            }
          </div>
        }
      }
    }
  </nav>
</aside>
