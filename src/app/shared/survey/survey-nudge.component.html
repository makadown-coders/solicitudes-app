@if (svc.nudgeOpen()) {
  <div
    role="status" aria-live="polite"
    class="z-50 fixed bottom-4 right-4 p-4 max-w-sm text-sm leading-5 bg-white rounded-2xl border-gray-200 shadow-lg transition-all duration-300 border [margin-bottom:env(safe-area-inset-bottom)]">
    <div class="mb-1 font-semibold">¿Nos regalas un momento?</div>
    <p class="text-gray-700">Solo 3 preguntas rápidas para mejorar la captura. No solicitamos datos personales.</p>
    <div class="flex items-center gap-2 mt-3">
      <button (click)="svc.accept()"
        class="px-3 py-2 text-green-700 rounded-xl border-green-600 border hover:bg-green-50">
        Sí
      </button>
      <button (click)="svc.dismissSnooze()"
        class="px-3 py-2 text-gray-700 rounded-xl border-gray-300 border hover:bg-gray-50">
        Ahora no
      </button>
    </div>
  </div>
}
