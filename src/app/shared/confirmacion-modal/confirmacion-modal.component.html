<div class="z-50 fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
  <div class="relative p-6 max-w-md w-full bg-white rounded-lg shadow-lg">
    <h2 class="mb-4 text-xl font-bold text-green-800">{{ titulo }}</h2>
    <p class="mb-6 preline text-gray-700">{{ mensaje }}</p>

    <div class="flex justify-end space-x-2">
      @if (!soloInfo) {
        <button (click)="cancelar.emit()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
          {{ textoCancelar || 'Cancelar' }}
        </button>
      }

      <button
        (click)="confirmar.emit()"
        class="px-4 py-2"
          [ngClass]="soloInfo
            ? 'bg-green-800 text-white'
            : 'bg-red-600 text-white hover:bg-red-700 rounded'"
        >
        {{ textoConfirmar || 'Aceptar' }}
      </button>
    </div>
  </div>
</div>
